<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#20211F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("archimedes-theme");
          const system = matchMedia("(prefers-color-scheme: dark)").matches ? "charcoal" : "paper";
          document.documentElement.dataset.theme = stored === "charcoal" || stored === "paper" ? stored : system;
        } catch {
          document.documentElement.dataset.theme = "charcoal";
        }
      })();
    </script>
    <title>Archimedes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
